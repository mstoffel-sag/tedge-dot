# ot-registration: connector link status -> thin-edge child-device registration, and the
# connector capability descriptors -> the ot_call_method capability of devices with methods
input.mqtt.topics = ["te/+/+/ot/+/status/link", "te/device/main/service/+/ot/capabilities"]

[config]
# thin-edge entity type assigned to registered OT devices that do not declare one. A connector
# whose device config names a `type` (contract §3.1) reports it on the link status, and that
# wins over this — it says what the device *is* rather than which protocol reaches it.
device_type = "${params.device_type}"
# Comma-separated generic OT command capabilities to advertise on each device (so the cloud mapper
# routes the matching operations). `ot_write` backs c8y_SetRegister; `ot_write_coil` backs c8y_SetCoil;
# `parameter_update` backs c8y_ParameterUpdate (device parameters).
command_capabilities = "${params.command_capabilities}"
# Optional digital-twin fragment name. When set, the connector's device descriptor (from the link
# status `info`) is published to te/device/<device>///twin/<twin_fragment>. Empty = no twin.
twin_fragment = "${params.twin_fragment}"

[[steps]]
script = "main.js"
