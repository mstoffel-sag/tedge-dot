# OPC-UA connector configuration for the end-to-end test harness.
#
# Points map onto the nodes exposed by the asyncua simulator (see simulator/server.py),
# addressed by stable string NodeIds under namespace index 2:
#
#   ns=2;s=Temperature   -> float64 21.5
#   ns=2;s=Count         -> uint32  617001
#   ns=2;s=Setpoint      -> int32   0      (read/write round-trip)
#   ns=2;s=Running       -> bool    false  (read/write round-trip)
#   ns=2;s=DoesNotExist  -> read returns a Bad status -> quality "bad"
#   ns=2;s=Ticks         -> uint32, +1 every second -> push delivery via subscription

[connector]
protocol      = "opcua"
service_name  = "tedge-dot"
poll_interval = "1s"
log_level     = "info"
# Bounds one protocol call (contract §8.1). Lowered from the 30s default so the suite's
# subscription-inactivity test does not have to wait a full minute for the keep-alive window
# to lapse — see "Push Delivery Recovers From A Silent Server" in tests/opcua_e2e.robot.
operation_timeout = "5s"

[mqtt]
host = "broker"
port = 1883

[connection]
application_name = "tedge-dot"
security_policy  = "None"
security_mode    = "none"

[[device]]
name             = "opc1"
# The device type (§3.1), declared on the device itself here -- the Modbus harness inherits
# its type from a point library instead, so the pair covers both halves of the rule. It names
# the device's parameter sets (opcua_sim_control_parameters) and its thin-edge entity type.
type             = "opcua-sim"
protocol_address = { endpoint = "opc.tcp://simulator:4840/", security_policy = "None", security_mode = "none" }
default_mode     = "typed"

  [[device.point]]
  id       = "temperature"
  subscribe = false
  datatype = "float64"
  unit     = "°C"
  address  = { node_id = "ns=2;s=Temperature" }

  [[device.point]]
  id       = "count_u32"
  subscribe = false
  datatype = "uint32"
  address  = { node_id = "ns=2;s=Count" }

  # Int32 used for the numeric write round-trip.
  [[device.point]]
  id       = "setpoint"
  subscribe = false
  datatype = "int32"
  access   = "read_write"
  address  = { node_id = "ns=2;s=Setpoint" }

  # Boolean used for the boolean write round-trip. It also declares an alarm (standing while the
  # value is true: no `when`) and an event (on every change), which the ot-alarm / ot-event flows
  # raise from its samples alone.
  [[device.point]]
  id       = "running"
  subscribe = false
  datatype = "bool"
  access   = "read_write"
  address  = { node_id = "ns=2;s=Running" }
  meta     = { alarm = { type = "running_alarm", severity = "minor", text = "{point} is {value}" }, event = { type = "running_changed", text = "Running changed to {value}" } }

  # Reading this node returns a Bad status -> quality "bad".
  [[device.point]]
  id       = "bad_point"
  subscribe = false
  datatype = "uint16"
  address  = { node_id = "ns=2;s=DoesNotExist" }

  # Incremented every second by the simulator; delivered via OPC-UA subscription
  # (monitored item) rather than polling — the other points opt out with subscribe = false
  # (static nodes only notify once, and bad_point would reject the device subscription).
  # The free-form meta table is echoed verbatim in every sample envelope. `report` is the
  # reporting policy the SDK runtime applies (the value changes every second, so every push
  # still passes); it is listed in the capability descriptor's `reports`, not in the sample.
  [[device.point]]
  id       = "ticks"
  datatype = "uint32"
  address  = { node_id = "ns=2;s=Ticks" }
  report   = { on_change = true }
  meta     = { source = "sim" }

  # Subscribed, but pointing at the STATIC Temperature node, and it exists purely to make the
  # push tests discriminating.
  #
  # A subscription reports value CHANGES, so this point publishes its initial value once and
  # then goes quiet. Polling would republish it every poll_interval whether or not anything
  # changed. That silence is the one thing polling cannot imitate -- and it is the only usable
  # discriminator, because a RATE check cannot tell the two apart: with no sampling_interval set
  # (as on this device), the monitored item is sampled at the point's resolved poll interval, so
  # push and polling deliver at the same rate by design. See
  # "Subscribed Static Node Falls Silent After Its First Value" in tests/opcua_e2e.robot.
  [[device.point]]
  id       = "temperature_pushed"
  datatype = "float64"
  unit     = "°C"
  address  = { node_id = "ns=2;s=Temperature" }

  # The same static node, with a heartbeat (report.max_interval, contract §5.3). A subscription
  # never pushes it again, so every sample after the first is the runtime's on-demand read of
  # the node: what keeps a device whose values never change available in the cloud. See
  # "A Heartbeat Keeps A Static Subscribed Node Reporting" in tests/opcua_e2e.robot.
  [[device.point]]
  id       = "temperature_heartbeat"
  datatype = "float64"
  unit     = "°C"
  address  = { node_id = "ns=2;s=Temperature" }
  report   = { on_change = true, max_interval = "3s" }

  # The Count node again, as a read-only parameter that names its own key in its set: the
  # `counters` twin fragment carries it as `count`, not as its id, and the capability descriptor
  # lists the key (parameter_keys, §7) so the flows know it before the point samples. Last on
  # purpose: `describe` renders sets in the order they first appear, and the describe test reads
  # the first one.
  [[device.point]]
  id       = "cycle_count"
  subscribe = false
  datatype = "uint32"
  address  = { node_id = "ns=2;s=Count" }
  meta     = { parameter = { key = "counters.count" }, measurement = false }

  # The Count node as a literal parameter (§5.2 meta.parameter.fragment): published as the twin
  # fragment itself (`617001`, not an object), and listed in parameter_keys with its fragment.
  [[device.point]]
  id       = "count_literal"
  subscribe = false
  datatype = "uint32"
  address  = { node_id = "ns=2;s=Count" }
  meta     = { parameter = { fragment = "opcua_sim_cycle_count" }, measurement = false }

  # Switched off (§3.3): the changing Ticks node, which would push a sample every second if this
  # point were subscribed, and a key which would be listed in parameter_keys. Neither may happen
  # — see "A Disabled Point Is Never Subscribed" in tests/opcua_e2e.robot. After cycle_count, so a
  # regression here cannot reorder the sets the describe test reads.
  [[device.point]]
  id       = "ticks_off"
  enabled  = false
  datatype = "uint32"
  address  = { node_id = "ns=2;s=Ticks" }
  meta     = { parameter = { key = "counters.ticks" } }

# The same simulator again, as a device whose only point is pushed: nothing is ever polled from it.
# That is the configuration where a lost session used to show nothing at all -- there is no read
# to fail -- so the push recovery tests check this device too. See "Push-Only Device Recovers
# After A Long Server Outage" in tests/opcua_e2e.robot.
[[device]]
name             = "opc2"
protocol_address = { endpoint = "opc.tcp://simulator:4840/", security_policy = "None", security_mode = "none" }
default_mode     = "typed"

  [[device.point]]
  id       = "ticks"
  datatype = "uint32"
  address  = { node_id = "ns=2;s=Ticks" }

# A pushed point sampled much faster than the device polls (contract §3.1 `sampling_interval`).
# With only poll_interval the monitored item would be sampled -- and the subscription published --
# once an hour, so Ticks (+1 every second) would arrive at most hourly; sampling_interval makes
# the server sample and publish every 200 ms, so every tick arrives. See "Sampling Interval
# Outpaces A Slow Poll Interval" in tests/opcua_e2e.robot. It has its own simulator
# (sampling-simulator in docker-compose.yaml), out of the way of the outage tests.
[[device]]
name              = "opc3"
protocol_address  = { endpoint = "opc.tcp://sampling-simulator:4840/", security_policy = "None", security_mode = "none" }
default_mode      = "typed"
poll_interval     = "1h"
sampling_interval = "200ms"

  [[device.point]]
  id       = "ticks"
  datatype = "uint32"
  address  = { node_id = "ns=2;s=Ticks" }
