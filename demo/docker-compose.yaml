# All-in-one OT simulator stack for demoing tedge-dot on a real Linux device.
#
# This single compose file starts a simulator for every supported OT protocol.
# It contains ONLY simulators — no MQTT broker and no connectors.  The connectors
# run natively on the host (installed from the tedge-dot package) and publish to
# the thin-edge.io mosquitto broker already running on the device (127.0.0.1:1883).
#
#   ┌────────────────────────── Linux device ─────────────────────────────┐
#   │                                                                     │
#   │  docker compose (this file)            tedge-dot.service (package)  │
#   │  ┌───────────────────────┐              ┌──────────────────────────┐│
#   │  │ modbus-sim   :5020     │◄── tcp ─────│ tedge-dot (modbus)       ││
#   │  │ opcua-sim    :4840     │◄── tcp ─────│ tedge-dot (opcua)        ││
#   │  │ canbus-sim   vcan0     │◄── socketcan│ tedge-dot (canbus)       ││
#   │  │ canopen-sim  vcan0     │◄── socketcan│ tedge-dot (canopen)      ││
#   │  │ profibus-sim :9200     │◄── tcp ─────│ tedge-dot (profibus)     ││
#   │  │ snmp-agent-sim :1161   │◄── udp ─────│ tedge-dot (snmp)         ││
#   │  │ snmp-sim     traps     │── udp :162 ►│                          ││
#   │  └───────────────────────┘              │   └─ tedge-dot(profibus) ││
#   │                                         └─────────┬────────────────┘│
#   │                          mosquitto :1883 ◄────────┘ (thin-edge)     │
#   └─────────────────────────────────────────────────────────────────────┘
#
# Requirements (real Linux host, not macOS Docker Desktop):
#   * Docker Engine with privileged containers and host networking.
#   * Kernel CAN/vcan support for the canbus/canopen sims:
#       CONFIG_CAN, CONFIG_CAN_RAW, CONFIG_CAN_VCAN  (modprobe vcan)
#
# Usage:
#   docker compose -f demo/docker-compose.yaml up -d           # pull prebuilt images
#   docker compose -f demo/docker-compose.yaml up -d --build   # build from source
#   docker compose -f demo/docker-compose.yaml down -v
#
# Or via just:  just demo-sims-up  /  just demo-sims-down
#
# Each service references the prebuilt image published to GHCR by the
# "Publish simulators" workflow (pull_policy: missing pulls it when absent),
# so no repository checkout is needed just to run the simulators.  Override
# the source with SIM_IMAGE_REPO / SIM_IMAGE_TAG if needed.  The build:
# section is kept for development: build context is the repository root (..),
# matching the COPY paths inside each connectors/<proto>/sim/Dockerfile.

name: tedge-dot-simulators

services:
  # --- Modbus TCP simulator (pymodbus) ---------------------------------------
  # Exposes a real Modbus TCP server on host port 5020.
  modbus-sim:
    image: ${SIM_IMAGE_REPO:-ghcr.io/thin-edge/tedge-dot}/modbus-sim:${SIM_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: ..
      dockerfile: connectors/modbus/sim/Dockerfile
    ports:
      - "5020:502"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # --- OPC-UA simulator (python-asyncua) -------------------------------------
  # Uses host networking so the server can both bind and advertise 127.0.0.1:4840
  # consistently. (asyncua binds the same host it advertises, and a 127.0.0.1
  # bind is not reachable through a published Docker port, so host networking is
  # the robust choice here.) The connector dials opc.tcp://127.0.0.1:4840/.
  opcua-sim:
    image: ${SIM_IMAGE_REPO:-ghcr.io/thin-edge/tedge-dot}/opcua-sim:${SIM_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: ..
      dockerfile: connectors/opcua/sim/Dockerfile
    network_mode: host
    environment:
      OPCUA_ENDPOINT_HOST: "127.0.0.1"
      # Temperature/Count change every second, so subscribed points keep delivering.
      OPCUA_SIM_DYNAMIC: "1"
    restart: unless-stopped

  # --- secured OPC-UA simulator (opt-in: --profile secure) -------------------
  # The same simulator presenting a generated certificate on 127.0.0.1:4841
  # (Basic256Sha256 / Aes256_Sha256_RsaPss, user operator/demo-password), for the
  # `opc-secure` device in config/opcua.toml. Its certificate is not trusted
  # until you run `tedge-dot pki trust` (see that file).
  opcua-secure-sim:
    image: ${SIM_IMAGE_REPO:-ghcr.io/thin-edge/tedge-dot}/opcua-sim:${SIM_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: ..
      dockerfile: connectors/opcua/sim/Dockerfile
    profiles: ["secure"]
    network_mode: host
    environment:
      OPCUA_ENDPOINT_HOST: "127.0.0.1"
      OPCUA_SIM_DYNAMIC: "1"
      OPCUA_PKI_VECTORS: /pki-vectors
      OPCUA_CERT_HOSTNAMES: "127.0.0.1,localhost"
      OPCUA_SECURE_SERVERS: "4841=untrusted"
      OPCUA_SECURE_POLICIES: "Basic256Sha256_SignAndEncrypt,Aes256Sha256RsaPss_SignAndEncrypt"
      OPCUA_USERS: "operator:demo-password"
    volumes:
      - opcua-secure-pki:/pki-vectors
    restart: unless-stopped

  # --- CAN bus simulator (python-can) ----------------------------------------
  # Shares the host kernel network namespace so vcan0 is visible to the native
  # connector.  Creates vcan0 if it does not already exist, then broadcasts
  # ENGINE_STATUS frames at 10 Hz.
  canbus-sim:
    image: ${SIM_IMAGE_REPO:-ghcr.io/thin-edge/tedge-dot}/canbus-sim:${SIM_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: ..
      dockerfile: connectors/canbus/sim/Dockerfile
    network_mode: host
    privileged: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ip", "link", "show", "vcan0"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  # --- CANopen simulator (python-canopen) ------------------------------------
  # Also uses vcan0 (multi-drop bus): the canbus sim broadcasts ID 0x1A0 frames
  # while this node serves CANopen SDO requests for node ID 1.  Different COB-IDs
  # so the two coexist on the same virtual bus, exactly as on real hardware.
  canopen-sim:
    image: ${SIM_IMAGE_REPO:-ghcr.io/thin-edge/tedge-dot}/canopen-sim:${SIM_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: ..
      dockerfile: connectors/canopen/sim/Dockerfile
    network_mode: host
    privileged: true
    restart: unless-stopped
    depends_on:
      canbus-sim:
        condition: service_healthy

  # --- PROFIBUS-DP slave simulator (Python DP-V0 slave + socat) --------------
  # PTYs cannot cross the container/host boundary, so the image exposes the
  # simulated slave's serial line over TCP on port 9200 (see the sim
  # Dockerfile). The host-side connector speaks serial-over-TCP to it directly:
  # port = "tcp://127.0.0.1:9200".
  profibus-sim:
    image: ${SIM_IMAGE_REPO:-ghcr.io/thin-edge/tedge-dot}/profibus-sim:${SIM_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: ..
      dockerfile: connectors/profibus/sim/Dockerfile
    ports:
      - "9200:9200"
    restart: unless-stopped

  # --- SNMP agent simulator (pysnmp) -----------------------------------------
  # The agent demo/config/snmp.toml polls and writes to: host networking on the unprivileged
  # udp/1161, so its responses come from 127.0.0.1 — the same address the device's traps come
  # from. v1/v2c communities public (read) / private (write), and SNMPv3 users; see
  # connectors/snmp/agent/agent.py.
  snmp-agent-sim:
    image: ${SIM_IMAGE_REPO:-ghcr.io/thin-edge/tedge-dot}/snmp-agent-sim:${SIM_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: ..
      dockerfile: connectors/snmp/agent/Dockerfile
    network_mode: host
    environment:
      SNMP_AGENT_PORT: "1161"
      # The e2e suite reads a per-request log; the demo does not need it.
      SNMP_LOG_REQUESTS: "0"
    restart: unless-stopped

  # --- SNMP trap simulator (net-snmp) ----------------------------------------
  # Host networking, so its traps reach the connector's udp/162 from 127.0.0.1 — the source
  # address demo/config/snmp.toml routes to its device. Sends a round of notifications (pump
  # temperature, linkDown/linkUp, now and then a coldStart) every TRAP_INTERVAL seconds; send
  # one yourself with `docker compose -f demo/docker-compose.yaml exec snmp-sim send-trap linkdown 2`.
  snmp-sim:
    image: ${SIM_IMAGE_REPO:-ghcr.io/thin-edge/tedge-dot}/snmp-sim:${SIM_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: ..
      dockerfile: connectors/snmp/sim/Dockerfile
    network_mode: host
    environment:
      TRAP_TARGET: "127.0.0.1:162"
      TRAP_INTERVAL: "10"
    restart: unless-stopped

  # --- AVEVA PI Web API simulator (our own, aiohttp) ---------------------------
  # Plain HTTP without authentication on host port 8480, for demo/config/aveva-pi.toml. A real
  # PI Web API server is HTTPS; see connectors/aveva-pi/sim/server.py for the TLS and auth modes.
  aveva-pi-sim:
    image: ${SIM_IMAGE_REPO:-ghcr.io/thin-edge/tedge-dot}/aveva-pi-sim:${SIM_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: ..
      dockerfile: connectors/aveva-pi/sim/Dockerfile
    environment:
      SIM_TLS: "0"
    ports:
      - "8480:8080"
    restart: unless-stopped

volumes:
  # The secured OPC-UA simulator's generated certificates (kept across restarts, so a trusted
  # certificate stays trusted).
  opcua-secure-pki:
